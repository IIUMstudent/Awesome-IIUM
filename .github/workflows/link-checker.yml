name: Link Checker

# Checks links in the built site, the way visitors see them, every week.
# Broken external links are reported in a single
# "[Automated] Broken Links Detected" issue that is updated each week.
# Internal links are also checked on every push and PR, in ci.yml.

on:
  schedule:
    # Weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Build site
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          # Serve dist under the site base so /Awesome-IIUM/... links resolve
          mkdir _site && cp -r dist _site/Awesome-IIUM

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --offline
            --no-progress
            --root-dir ${{ github.workspace }}/_site
            --index-files index.html
            --exclude-path _site/Awesome-IIUM/pagefind
            '_site/**/*.html'
          fail: true
          jobSummary: true

      - name: Check external links
        id: external
        uses: lycheeverse/lychee-action@v2
        with:
          # Social networks block automated requests, so they are skipped.
          args: >
            --no-progress
            --root-dir ${{ github.workspace }}/_site
            --index-files index.html
            --exclude-path _site/Awesome-IIUM/pagefind
            --exclude 'iiumstudent\.github\.io|instagram\.com|facebook\.com|linkedin\.com|twitter\.com|x\.com'
            --accept '200..=299,403,429'
            --max-retries 3
            --timeout 30
            '_site/**/*.html'
          fail: false
          output: ./lychee-report.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report broken external links
        if: steps.external.outputs.exit_code != '' && steps.external.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title='[Automated] Broken Links Detected'
          gh label create broken-link --color d73a4a --force
          existing=$(gh issue list --label broken-link --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file lychee-report.md
          else
            gh issue create --title "$title" --label broken-link --body-file lychee-report.md
          fi
