name: Dependabot Auto-merge

# Merges Dependabot's minor and patch updates once the site builds, lint
# and unit tests pass, and internal links are intact. Major updates are left
# open for a human to review.
#
# Merges made with GITHUB_TOKEN don't trigger the push deploy; the scheduled
# deploy (every 3 hours) publishes them.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2

      - name: Skip major updates
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: echo "::notice::Major update - leaving this PR for a human to review."

      - uses: actions/checkout@v4
        if: steps.meta.outputs.update-type != 'version-update:semver-major'

      - name: Setup pnpm
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Lint, test and build
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm test
          pnpm build
          mkdir _site && cp -r dist _site/Awesome-IIUM

      - name: Check internal links
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --offline
            --no-progress
            --root-dir ${{ github.workspace }}/_site
            --index-files index.html
            --exclude-path _site/Awesome-IIUM/pagefind
            '_site/**/*.html'
          fail: true

      - name: Merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
