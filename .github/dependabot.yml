version: 2
updates:
  # npm dependencies. Minor and patch updates are grouped into one PR and
  # merged automatically once checks pass (workflows/dependabot-auto-merge.yml).
  # Major updates get their own PR and need a human to review them.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps):"
      prefix-development: "chore(deps-dev):"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
    labels:
      - "github-actions"
      - "automated"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
